name: release
# Push a tag such as v0.1.0 and this builds the tarballs, the .deb and SHA256SUMS,
# then attaches them to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: safeshell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: safeshell/go.mod
      - run: make check
      - run: make dist VERSION=${{ github.ref_name }}
      - run: make deb VERSION=${{ github.ref_name }}
      - name: Checksums for everything we ship
        run: cd dist && sha256sum *.tar.gz *.deb > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/*.deb dist/SHA256SUMS --generate-notes
